<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- for less than use &lt; <br> -->
    <h1>a&lt;b</h1> 
    <!-- for greater than use &gt; <br> -->
    <h1>a&gt;b</h1> 
    <!-- for spaces use &nbsp; <br> -->
    <p>SRM &nbsp; &nbsp; &nbsp; AP</p>
    <!-- for heart use &hearts; <br> -->
    <h1> &hearts;</h1>
    <!-- for ampersand use &amp; <br> -->
    <p>A &amp;</p>
    <!-- for double quotes use &quot; <br> -->
    <p>&quot;Hello World&quot;</p>

    <!-- for star use &bigstar; <br> -->
    <h2> this ia a &bigstar;</h2>
</body>
</html>
